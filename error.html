<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrong Answer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type ="image/png" href="nations/question.png">
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error{
            max-width: 500px;
            padding: 20px;
        }
        h1{
            font-size: 8rem;
            margin: 0;
            color: #F4EB6C;
            margin-bottom: 40px;
        }
        p{
            font-size: 1.2rem;
            margin-bottom: 30px;
            margin-top: 10px;
        }
        a{
            text-decoration: none;
            background-color: #8ACFF8;
            color: black;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: bold;
        }
        a:hover{
            background-color: #FFD444;
        }
    </style>
</head>
<body>
    <div class="error">
        <h1>404</h1>
        <h2>Oops! Answer Not Found</h2>
        <p>The Answer you followed might be wrong, or the country may have been lost.</p>
        <a href="index.html">Try again</a>
    </div>
</body>
</html>
